schema_version: "1.0"
inputs:
  system: "./system.yaml"
  firmware: "../firmware/h563-uds-physical.elf"
limits:
  max_steps: 4000000
assertions:
  - uart_contains: "H563-UDS-ECU PHYSICAL HAL 500K/2M FD"
  - uart_ordered: ["ECU_READY", "H563-UDS-ECU PHYSICAL HAL", "ECU_READY"]
  - uds_tester: { id: "uds-tester", result: done }
