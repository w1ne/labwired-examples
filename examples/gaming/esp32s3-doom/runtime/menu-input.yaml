schema_version: "1.2"
inputs:
  firmware: "../firmware/artifacts/doom-s3.elf"
  system: "system.yaml"
limits:
  max_steps: 900000000
  wall_time_ms: 300000
  max_uart_bytes: 131072
assertions:
  - expected_stop_reason: max_steps
  - uart_contains: "doom initialised, entering tick loop"
  - display_region:
      id: "tft"
      min_ink: 0.2
uart_injections:
  - uart: "uart0"
    bytes: [27]
    trigger: !after_cycles {cycles: 650000000}
