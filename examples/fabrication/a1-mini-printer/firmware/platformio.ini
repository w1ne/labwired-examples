[platformio]
default_envs = a1-reference

[env:a1-reference]
platform = ststm32@20.0.0
board = genericSTM32F411CE
framework = arduino
platform_packages =
    platformio/framework-arduinoststm32@4.30000.0
    platformio/framework-cmsis@2.60300.0
    platformio/framework-cmsis-dsp@1.16.2
    platformio/toolchain-gccarmnoneeabi@1.120301.0
board_build.f_cpu = 100000000L
build_flags = -DHSE_VALUE=8000000U
monitor_speed = 115200
