# A bounded execution probe, not the complete FC acceptance test.
# The committed pre-DEMCR receipt fails at the first unsupported register.
schema_version: '1.2'
inputs:
  firmware: ../../firmware/native-fc/artifacts/betaflight_RP2350B_OPENFC_LITE_REV2_LW1.elf
  system: system.yaml
limits:
  max_steps: 10000000
  wall_time_ms: 120000
  max_uart_bytes: 65536
assertions:
  - expected_stop_reason: max_steps
